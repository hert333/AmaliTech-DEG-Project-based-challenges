global:
  scrape_interval: 15s # How often to check the vitals (Requirement: 15s)

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'reyla-logistics'
    static_configs:
      - targets:
        - 'order-service:3001'      # The name of the service and its port
        - 'tracking-service:3002'
        - 'notification-service:3003'


    relabel_configs:
      - source_labels: [__address__]
        target_label: service_name
        regex: '([^:]+):.*'
        replacement: '$1'
